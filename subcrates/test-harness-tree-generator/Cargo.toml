[package]
name = "fs-more-test-harness-generator"
version = "0.8.1"
edition = "2021"
publish = false


[dependencies]
fs-more-test-harness-tree-schema = { path = "../test-harness-tree-schema", features = ["serializable_tree_schema"] }


thiserror = "2.0.20"
miette = { version = "7.6.0", features = ["fancy"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

clap = { version = "4.6.6", features = ["derive"] }

schemars = "1.2.2"

quote = "1.0.47"
syn = "3.0.3"
proc-macro2 = "1.0.107"
prettyplease = "0.3.0"

heck = "0.5.0"
itertools = "0.15.0"

path-slash = "0.2.1"

humansize = "2.1.3"
